<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 수학 발견 수업</title>
  <meta name="description" content="AI가 수학 난제를 탐구한 연구를 고등학교 수학 수업 활동으로">
  <link rel="stylesheet" href="core/ui.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>AI 수학 발견 수업</h1>
      <p class="subtitle">AI가 수학 난제를 탐구한 실제 연구를 고등학교 수학 시간에 직접 체험합니다.</p>
      <nav class="site-nav"><a href="teacher.html">교사용 평가 페이지</a></nav>
    </div>
  </header>
  <main class="wrap">
    <section class="filters card" aria-label="활동 찾기">
      <div class="field"><label for="f-subject">과목·단원</label><select id="f-subject"></select></div>
      <div class="field"><label for="f-topic">주제</label><select id="f-topic"></select></div>
      <div class="field"><label for="f-diff">난이도</label>
        <select id="f-diff"><option value="">모든 난이도</option><option value="1">★ 쉬움</option><option value="2">★★ 보통</option><option value="3">★★★ 도전</option></select></div>
      <div class="field grow"><label for="f-text">검색</label><input id="f-text" type="search" placeholder="예: 행렬, 기울기"></div>
    </section>
    <p id="count" class="muted small" aria-live="polite"></p>
    <div id="module-list" class="module-grid"></div>
  </main>
  <footer class="wrap site-footer muted small">
    학생 정보는 어디에도 전송·저장되지 않습니다 · 코드 MIT, 콘텐츠 CC BY 4.0
    <p id="offline-status" class="offline-status" aria-live="polite"></p>
  </footer>
  <script type="module" src="core/home.js"></script>
</body>
</html>
